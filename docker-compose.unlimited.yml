# docker-compose.unlimited.yml
# Remove as limitações para testes locais de alta performance

services:
  lb:
    environment:
      - MAX_CONNS=16384
      - RING_QD=8192
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '512M'

  api1: &api-unlimited
    environment:
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=4
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: '2G'

  api2:
    <<: *api-unlimited

  api3:
    <<: *api-unlimited

  api4:
    <<: *api-unlimited

  warmup:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '128M'
