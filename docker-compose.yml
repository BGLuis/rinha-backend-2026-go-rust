x-api-common: &api-common
  image: luiis001/rinha-api-2026:latest
  pull_policy: always
  volumes:
    - shared_sockets:/tmp/sockets
  networks:
    - rinha-net
  security_opt:
    - seccomp:unconfined
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: '0.45'
        memory: '150M'

services:
  lb:
    image: luiis001/rinha-lb-2026:latest
    pull_policy: always
    environment:
      - PORT=9999
      - UPSTREAMS=/tmp/sockets/api1.sock,/tmp/sockets/api2.sock
    volumes:
      - shared_sockets:/tmp/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - rinha-net
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: '50M'

  api1:
    <<: *api-common
    environment:
      - SOCKET_PATH=/tmp/sockets/api1.sock
      - GOMEMLIMIT=130MiB
      - GOGC=1000

  api2:
    <<: *api-common
    environment:
      - SOCKET_PATH=/tmp/sockets/api2.sock
      - GOMEMLIMIT=130MiB
      - GOGC=1000

  warmup:
    image: curlimages/curl:8.8.0
    platform: linux/amd64
    entrypoint: ["/bin/sh", "/warmup.sh"]
    environment:
      - BASE_URL=http://lb:9999
      - READY_RETRIES=240
      - READY_SLEEP=0.25
      - WARMUP_ROUNDS=48
    volumes:
      - ./scripts/warmup.sh:/warmup.sh:ro
    depends_on:
      - lb
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"
    restart: "no"

volumes:
  shared_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha-net:
    driver: bridge
