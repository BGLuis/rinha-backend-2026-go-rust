version: '3.8'

x-api-common: &api-common
  build: .
  volumes:
    - shared_sockets:/tmp/sockets
  networks:
    - rinha-net
  security_opt:
    - seccomp:unconfined
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: '0.42'
        memory: '160M'

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_sockets:/tmp/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - rinha-net
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: '30M'

  api1:
    <<: *api-common
    environment:
      - SOCKET_PATH=/tmp/sockets/api1.sock
      - GOGC=1000
      - GOMEMLIMIT=150MiB
      - GOMAXPROCS=1

  api2:
    <<: *api-common
    environment:
      - SOCKET_PATH=/tmp/sockets/api2.sock
      - GOGC=1000
      - GOMEMLIMIT=150MiB
      - GOMAXPROCS=1

volumes:
  shared_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha-net:
    driver: bridge
