x-api-common: &api-common
  build: .
  volumes:
    - shared_sockets:/tmp/sockets
  networks:
    - rinha-net
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
    memlock:
      soft: -1
      hard: -1
  deploy:
    resources:
      limits:
        cpus: '0.43'
        memory: '140M'

services:
  lb:
    build:
      context: .
      dockerfile: Dockerfile.lb
    environment:
      - PORT=9999
      - UPSTREAMS=/tmp/sockets/api1.sock,/tmp/sockets/api2.sock
    volumes:
      - shared_sockets:/tmp/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - rinha-net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: '50M'

  api1:
    <<: *api-common
    environment:
      - SOCKET_PATH=/tmp/sockets/api1.sock
      - GOMEMLIMIT=130MiB
      - GOGC=1000

  api2:
    <<: *api-common
    environment:
      - SOCKET_PATH=/tmp/sockets/api2.sock
      - GOMEMLIMIT=130MiB
      - GOGC=1000

volumes:
  shared_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha-net:
    driver: bridge
