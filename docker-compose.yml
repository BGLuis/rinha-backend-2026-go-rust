volumes:
  shared_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  shared_dataset:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=150m"

networks:
  rinha-net:
    driver: bridge
