
services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_sockets:/tmp/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: '30M'

  api1:
    build: .
    volumes:
      - shared_sockets:/tmp/sockets
    environment:
      - SOCKET_PATH=/tmp/sockets/api1.sock
      - GOGC=1000
      - GOMEMLIMIT=150MiB
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: '0.42'
          memory: '160M'

  api2:
    build: .
    volumes:
      - shared_sockets:/tmp/sockets
    environment:
      - SOCKET_PATH=/tmp/sockets/api2.sock
      - GOGC=1000
      - GOMEMLIMIT=150MiB
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: '0.42'
          memory: '160M'

volumes:
  shared_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
