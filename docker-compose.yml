x-api-common: &api-common
  build: .
  volumes:
    - shared_sockets:/tmp/sockets
    - shared_dataset:/shared
  networks:
    - rinha-net
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
    memlock:
      soft: -1
      hard: -1
  deploy:
    resources:
      limits:
        cpus: '0.45'
        memory: '150M'

services:
  lb:
    build:
      context: .
      dockerfile: Dockerfile.lb
    restart: always
    environment:
      - PORT=9999
      - UPSTREAMS=/tmp/sockets/api1.sock,/tmp/sockets/api2.sock
    volumes:
      - shared_sockets:/tmp/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - rinha-net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: '50M'

  api1:
    <<: *api-common
    restart: always
    environment:
      - SOCKET_PATH=/tmp/sockets/api1.sock
      - SHARED_DATASET_PATH=/shared/dataset.bin
      - GOMEMLIMIT=130MiB
      - GOGC=1000

  api2:
    <<: *api-common
    restart: always
    environment:
      - SOCKET_PATH=/tmp/sockets/api2.sock
      - SHARED_DATASET_PATH=/shared/dataset.bin
      - GOMEMLIMIT=130MiB
      - GOGC=1000

