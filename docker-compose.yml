version: '3.8'

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_sockets:/tmp/sockets
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: '30M'

  api1:
    image: bgluis/rinha-api-2026:latest
    volumes:
      - shared_sockets:/tmp/sockets
    environment:
      - SOCKET_PATH=/tmp/sockets/api1.sock
    deploy:
      resources:
        limits:
          cpus: '0.42'
          memory: '160M'

  api2:
    image: bgluis/rinha-api-2026:latest
    volumes:
      - shared_sockets:/tmp/sockets
    environment:
      - SOCKET_PATH=/tmp/sockets/api2.sock
    deploy:
      resources:
        limits:
          cpus: '0.42'
          memory: '160M'

volumes:
  shared_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
